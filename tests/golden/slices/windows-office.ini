# Slice instance wo, written by GraySpace. Used only by ansible/slice.yml.

[edges]
wo-office-edge ansible_host=10.0.9.10 ansible_user=root

[hosts]
wo-mail ansible_host=10.0.9.11 ansible_user=root
wo-dc ansible_host=10.0.9.12 ansible_user=grayspace ansible_become=true
wo-files ansible_host=10.0.9.13 ansible_user=root
wo-win ansible_host=10.0.9.14 ansible_user=Administrator ansible_shell_type=powershell ansible_shell_executable=None

[ubuntu]
wo-mail
wo-dc
wo-files

[windows]
wo-win

[alpine:children]
edges

[all:vars]
ansible_ssh_private_key_file=/repo/.ssh/terraform_key
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
