---
- name: Collect role settings
  ansible.builtin.set_fact:
    web_title: "{{ (slice_role_vars.web | default({})).site_title | default(web_site_title) }}"
    web_tls: "{{ slice_hosts[inventory_hostname].certificate is not none }}"

- name: Install nginx
  ansible.builtin.include_role:
    name: grayspace-host
    tasks_from: packages
  vars:
    gs_packages: [nginx]

- name: Write the placeholder site
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    mode: "0644"

- name: Configure the site
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/default
    mode: "0644"
  notify: Reload nginx

- name: Start nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
