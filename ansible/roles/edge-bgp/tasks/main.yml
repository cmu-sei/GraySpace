---
# A routed site's edge: announces the site's public /24 over eBGP, with a private ASN,
# to each base router it attaches to, and learns the simulated internet from them. With two
# attachments, losing one base link fails traffic over to the other.
- name: Collect edge settings
  ansible.builtin.set_fact:
    edge: "{{ slice_edges[inventory_hostname] }}"

# The GraySpace image has it, so the install (and its index download) is skipped there
- name: Check for frr
  ansible.builtin.command: apk info -e frr
  register: edge_frr_check
  changed_when: false
  failed_when: false

- name: Install FRR
  community.general.apk:
    name: frr
    state: present
    update_cache: true
  when: edge_frr_check.rc != 0

- name: Forward packets, with loose reverse-path filtering for asymmetric dual-homed paths
  ansible.builtin.copy:
    dest: /etc/sysctl.d/grayspace.conf
    content: |
      net.ipv4.ip_forward = 1
      net.ipv4.conf.all.rp_filter = 2
      net.ipv4.conf.default.rp_filter = 2
    mode: "0644"
  notify: Apply sysctl

- name: Enable bgpd
  ansible.builtin.lineinfile:
    path: /etc/frr/daemons
    regexp: "^bgpd="
    line: bgpd=yes
  notify: Restart FRR

- name: Deploy the FRR configuration
  ansible.builtin.template:
    src: frr.conf.j2
    dest: /etc/frr/frr.conf
    owner: frr
    group: frr
    mode: "0644"
  notify: Restart FRR

- name: Start FRR at boot
  ansible.builtin.service:
    name: frr
    state: started
    enabled: true
