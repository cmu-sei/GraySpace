# The guests' proxy, for the plays that install packages (main.yml, slice.yml). TF_VAR_proxy and
# TF_VAR_no_proxy decide when set, even to empty (no proxy: a Proxmox connection's proxy_mode none);
# unset, the controller's own http_proxy, https_proxy and no_proxy. Undefined without a proxy, so
# the plays' default(omit) passes nothing.
[all:vars]
http_proxy={{ lookup('ansible.builtin.env', 'TF_VAR_proxy', default=lookup('ansible.builtin.env', 'http_proxy', default='')) or undef() }}
https_proxy={{ lookup('ansible.builtin.env', 'TF_VAR_proxy', default=lookup('ansible.builtin.env', 'https_proxy', default='')) or undef() }}
no_proxy={{ lookup('ansible.builtin.env', 'TF_VAR_no_proxy', default=lookup('ansible.builtin.env', 'no_proxy', default='')) or undef() }}
