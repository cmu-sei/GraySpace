---
# Configure one slice instance. Jobs run:
#
#   ansible-playbook -i slice-inventory/<id>.ini -e @slice-inventory/<id>.vars.json slice.yml
#
# The inventory lives outside inventory/, so base runs never touch slice hosts and this play never
# touches base hosts. Guests come up with their simulated address, gateway and resolver already set
# by Terraform. Packages come from the real internet, which only the management network reaches, so:
#   1. prepare: send default traffic over the management NIC for the run
#   2. edge roles and host roles
#   3. finalize (grayspace-host): the simulated default route and resolver, the GraySpace CAs, and
#      no management default route, now and after reboots
#
# Behind a proxy, steps 1 and 2 use it as the base's plays do: jobs pass inventory/proxy.ini too,
# which reads TF_VAR_proxy and TF_VAR_no_proxy (the site's, or the Proxmox connection's), else the
# controller's http_proxy, https_proxy and no_proxy.
# Addresses that stay on management (the GHOSTS API, gs_mgmt_route_ips from prepare) are added to
# no_proxy, so they are reached directly.

- name: Prepare slice guests
  hosts: edges:hosts
  gather_facts: false
  environment: &proxy_env
    http_proxy: "{{ http_proxy | default(omit) }}"
    https_proxy: "{{ https_proxy | default(omit) }}"
    no_proxy: >-
      {{ ((no_proxy | default('')).split(',') + slice_mgmt_routes | default([]) + gs_mgmt_route_ips | default([]))
         | map('trim') | select | unique | join(',') }}
  tasks:
    - name: Wait for the guest
      ansible.builtin.wait_for_connection:
        timeout: 300
    - name: Prepare networking and certificates
      ansible.builtin.include_role:
        name: grayspace-host
        tasks_from: prepare

- name: Configure NAT edge routers
  hosts: edges
  gather_facts: false
  environment: *proxy_env
  tasks:
    - name: NAT
      ansible.builtin.include_role:
        name: edge-nat
      when: not slice_edges[inventory_hostname].routed
    - name: Peer over eBGP with the base routers
      ansible.builtin.include_role:
        name: edge-bgp
      when: slice_edges[inventory_hostname].routed

- name: Apply host roles
  hosts: hosts
  gather_facts: true
  environment: *proxy_env
  tasks:
    - name: Roles named in the slice spec
      ansible.builtin.include_role:
        name: "{{ role_item }}"
      loop: "{{ slice_hosts[inventory_hostname].roles }}"
      loop_control:
        loop_var: role_item

- name: Finalize slice guest networking
  hosts: edges:hosts
  gather_facts: false
  roles:
    - grayspace-host
